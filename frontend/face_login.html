<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face ID Authentication | GIETU</title>
    <link rel="stylesheet" href="theme.css">
    
    <style>
        /* Camera UI Customization */
        .camera-box {
            position: relative;
            width: 280px; 
            height: 280px;
            background: #000; 
            border-radius: 50%; /* Circular Biometric Look */
            overflow: hidden; 
            border: 3px solid var(--accent);
            margin: 0 auto 24px; 
            box-shadow: var(--glow);
            transition: all 0.5s var(--ease);
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1); /* Mirror view */
        }

        /* The Animated Laser Scanner */
        .scan-line {
            position: absolute; 
            width: 100%; 
            height: 4px;
            background: var(--cyan); 
            box-shadow: 0 0 20px var(--cyan);
            animation: scanLoop 2.5s infinite ease-in-out;
            z-index: 5;
            display: none;
        }

        @keyframes scanLoop { 
            0%, 100% { top: 15%; opacity: 0.2; } 
            50% { top: 80%; opacity: 1; } 
        }

        /* Success/Failure States */
        .camera-box.success { border-color: var(--green); box-shadow: 0 0 40px rgba(16, 185, 129, 0.4); }
        .camera-box.error { border-color: var(--red); box-shadow: 0 0 40px rgba(239, 68, 68, 0.4); }

        .shutter-flash {
            position: absolute; inset: 0;
            background: white; opacity: 0;
            pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>

    <div class="page-narrow">
        <div class="card" style="text-align: center; margin-top: 40px;">
            <div class="sec-hd">
                <div class="topbar-title" style="font-size: 1.8em; margin-bottom: 5px;">GIET UNIVERSITY</div>
                <h2>👤 AI Face Login</h2>
                <p>Ensure your face is well-lit and center-aligned</p>
            </div>

            <div class="camera-box" id="camContainer">
                <div class="shutter-flash" id="flash"></div>
                <video id="video" autoplay playsinline></video>
                <div class="scan-line" id="scanner"></div>
            </div>

            <div id="statusMsg" class="alert alert-info" style="display:none; justify-content: center; font-weight: 600;">
                Initializing secure stream...
            </div>

            <button class="btn btn-primary" id="startBtn" onclick="initCamera()">
                🚀 Start Biometric Scan
            </button>
            
            <div style="margin-top: 25px;">
                <a href="login.html" class="back-btn">
                    <span>←</span> Back to Password Login
                </a>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('statusMsg');
        const startBtn = document.getElementById('startBtn');
        const scanner = document.getElementById('scanner');
        const camContainer = document.getElementById('camContainer');
        const flash = document.getElementById('flash');

        let isScanning = false;
        let stream = null;

        async function initCamera() {
            startBtn.style.display = "none";
            status.style.display = "flex";
            status.innerHTML = "Requesting Camera Access...";

            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: 640, height: 480 } 
                });
                video.srcObject = stream;
                
                video.onplay = () => {
                    scanner.style.display = 'block';
                    isScanning = true;
                    status.innerHTML = "AI Scanning Face Features...";
                    // Start recognition loop
                    setTimeout(performAIDetection, 1000);
                };
            } catch (err) {
                status.className = "alert alert-danger";
                status.innerHTML = "❌ Camera Error: " + err.message;
                startBtn.style.display = "block";
            }
        }

        async function performAIDetection() {
            if (!isScanning) return;

            // Capture Frame
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            // Visual Flash Effect (Sync with AI Capture)
            flash.style.opacity = "0.4";
            setTimeout(() => flash.style.opacity = "0", 100);

            const base64Image = canvas.toDataURL('image/jpeg', 0.8);

            try {
                const response = await fetch('/auth/face_login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });

                const result = await response.json();

                if (result.success) {
                    // ✅ AI MATCH FOUND
                    isScanning = false;
                    camContainer.className = "camera-box success";
                    scanner.style.background = "var(--green)";
                    scanner.style.animation = "none";
                    scanner.style.top = "50%";
                    
                    status.className = "alert alert-success";
                    status.innerHTML = `✅ Authenticated: Welcome, ${result.name}!`;

                    // Stop Camera
                    if(stream) stream.getTracks().forEach(t => t.stop());

                    // Store in local storage for session handling
                    localStorage.setItem('user', JSON.stringify(result));

                    // Role-based Redirect
                    setTimeout(() => {
                        let path = "login.html";
                        if(result.role === 'student') path = 'student_dash/index.html';
                        else if(result.role === 'teacher') path = 'teacher_dash/index.html';
                        else if(result.role === 'parent') path = 'parent_dash/index.html';
                        window.location.replace(path);
                    }, 1500);

                } else {
                    // ❌ NO MATCH (Keep looking)
                    status.innerHTML = "Searching Database... Stay Still";
                    if(isScanning) setTimeout(performAIDetection, 2000); // Wait 2s before next shot
                }
            } catch (e) {
                console.error("AI Server Error:", e);
                status.className = "alert alert-danger";
                status.innerHTML = "Connection Error. Retrying...";
                if(isScanning) setTimeout(performAIDetection, 3000);
            }
        }
    </script>
</body>
</html>
