<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Rankings — GIET Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .rank-hero{
      text-align:center;
      background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(245,158,11,.06));
      border:1px solid rgba(251,191,36,.3);border-radius:var(--r-xl);
      padding:44px 30px;margin-bottom:24px;position:relative;overflow:hidden;
    }
    .rank-hero::before{content:'🏆';position:absolute;font-size:8em;opacity:.05;right:-20px;top:-20px;}
    .rank-hero .lbl{font-size:.72em;color:rgba(251,191,36,.7);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;}
    .rank-num{
      font-family:'Outfit',sans-serif;font-size:5em;font-weight:900;line-height:1;
      background:linear-gradient(135deg,var(--gold),#fde68a);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .rank-sub{margin-top:10px;font-size:.92em;color:var(--txt2);}
  </style>
</head>
<body>
<div class="page page-narrow">
  <div class="topbar">
    <div>
      <div class="topbar-title">🏆 Class Rankings</div>
      <div class="topbar-sub">Your standing among section peers</div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-gold btn-sm" onclick="dlReport(this)">📄 Report</button>
      <a href="index.html" class="back-btn">← Dashboard</a>
    </div>
  </div>

  <div class="rank-hero">
    <div class="lbl">Your Class Rank</div>
    <div class="rank-num">#<span id="rnk">--</span></div>
    <div class="rank-sub">Top <span id="pct">--%</span> of Section <span id="sec">--</span></div>
  </div>

  <div class="card">
    <div class="card-hd">
      <span class="card-title">You vs. Class Average</span>
      <span class="badge badge-gold">Live</span>
    </div>
    <div class="chart-box tall"><canvas id="cmpChart"></canvas></div>
  </div>
</div>
<script>
  const user = JSON.parse(localStorage.getItem('user'));
  if (!user || user.role !== 'student') window.location.replace('../login.html');

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const data = await fetch(`/api/students/${user.username}`).then(r=>r.json());
      document.getElementById('rnk').textContent = data.rank || '--';
      document.getElementById('sec').textContent = data.section || '--';
      if (data.total_students > 0)
        document.getElementById('pct').textContent = Math.ceil((data.rank/data.total_students)*100) + '%';

      const avgs = data.class_averages || {};
      new Chart(document.getElementById('cmpChart'),{
        type:'bar',
        data:{
          labels:['Math','Physics','Chem','CS','English','PE'],
          datasets:[
            {label:'My Marks',data:[data.math_marks,data.physics_marks,data.chemistry_marks,data.cs_marks,data.english_marks,data.pe_marks],backgroundColor:'rgba(91,124,255,.75)',borderRadius:7},
            {label:'Class Avg',data:[avgs.math||0,avgs.phy||0,avgs.chem||0,avgs.cs||0,avgs.eng||0,avgs.pe||0],backgroundColor:'rgba(255,255,255,.2)',borderRadius:7}
          ]
        },
        options:{responsive:true,maintainAspectRatio:false,
          scales:{y:{beginAtZero:true,max:100,grid:{color:'rgba(255,255,255,.06)'},ticks:{color:'rgba(154,171,216,.8)'}},
            x:{grid:{display:false},ticks:{color:'rgba(154,171,216,.8)'}}},
          plugins:{legend:{labels:{color:'rgba(154,171,216,.8)'}}}}
      });
    } catch(e){ console.error(e); }
  });

  async function dlReport(btn){
    const orig=btn.textContent; btn.textContent='⏳…'; btn.disabled=true;
    try{
      const res=await fetch('/api/report/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.username})});
      if(res.ok){const a=document.createElement('a');a.href=URL.createObjectURL(await res.blob());a.download=`Report_${user.username}.pdf`;a.click();btn.textContent='✅ Done';}
      else btn.textContent='❌ Failed';
    }catch(e){btn.textContent='❌ Error';}
    setTimeout(()=>{btn.textContent=orig;btn.disabled=false;},2500);
  }
</script>
</body>
</html>
