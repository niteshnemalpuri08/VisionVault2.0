<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Performance — GIET Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;margin-bottom:24px;}
    .sub-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 14px;text-align:center;transition:transform .25s;}
    .sub-card:hover{transform:translateY(-4px);}
    .sub-name{font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
    .sub-val{font-family:'Outfit',sans-serif;font-size:2.1em;font-weight:800;display:block;margin-bottom:6px;}
    .grade{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.7em;font-weight:700;}
    .g-a{background:rgba(16,185,129,.2);color:#6ee7b7;border:1px solid rgba(16,185,129,.3);}
    .g-b{background:rgba(91,124,255,.2);color:#a5b4fc;border:1px solid rgba(91,124,255,.3);}
    .g-c{background:rgba(245,158,11,.2);color:#fde68a;border:1px solid rgba(245,158,11,.3);}
    .g-d{background:rgba(239,68,68,.2);color:#fca5a5;border:1px solid rgba(239,68,68,.3);}
    .rank-pill{background:linear-gradient(135deg,#b45309,#fbbf24);color:#18100a;padding:5px 16px;border-radius:99px;font-weight:800;font-size:.85em;}
  </style>
</head>
<body>
<div class="page page-narrow">
  <div class="topbar">
    <div>
      <div class="topbar-title">📊 My Grades</div>
      <div class="topbar-sub">Current Rank: <span class="rank-pill" id="rnk">#--</span></div>
    </div>
    <a href="index.html" class="back-btn">← Dashboard</a>
  </div>

  <div class="sub-grid" id="marksGrid"></div>

  <div class="card">
    <div class="card-hd"><span class="card-title">Performance Curve</span></div>
    <div class="chart-box"><canvas id="mChart"></canvas></div>
  </div>
</div>
<script>
  const user = JSON.parse(localStorage.getItem('user'));
  if (!user) window.location.replace('../login.html');

  const gradeLabel = v => v>=90?'A+':v>=80?'A':v>=70?'B':v>=60?'C':'D';
  const gradeClass = v => v>=80?'g-a':v>=70?'g-b':v>=60?'g-c':'g-d';
  const gradeColor = v => v>=80?'var(--cyan)':v>=60?'var(--gold)':'var(--red)';

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const data = await fetch(`/api/students/${user.username}`).then(r=>r.json());
      document.getElementById('rnk').textContent = '#' + (data.rank||'N/A');
      const subjects = [
        {name:'Mathematics',  val:data.math_marks},
        {name:'Physics',      val:data.physics_marks},
        {name:'Chemistry',    val:data.chemistry_marks},
        {name:'Comp. Science',val:data.cs_marks},
        {name:'English',      val:data.english_marks},
        {name:'Phys. Ed',     val:data.pe_marks}
      ];
      document.getElementById('marksGrid').innerHTML = subjects.map(s=>`
        <div class="sub-card" style="border-bottom:3px solid ${gradeColor(s.val)}">
          <div class="sub-name">${s.name}</div>
          <span class="sub-val" style="color:${gradeColor(s.val)}">${s.val}</span>
          <span class="grade ${gradeClass(s.val)}">${gradeLabel(s.val)}</span>
        </div>`).join('');

      new Chart(document.getElementById('mChart'),{
        type:'line',
        data:{
          labels:subjects.map(s=>s.name),
          datasets:[{label:'Marks',data:subjects.map(s=>s.val),
            borderColor:'rgba(91,124,255,.9)',backgroundColor:'rgba(91,124,255,.1)',
            fill:true,tension:.4,pointBackgroundColor:'#5b7cff',pointRadius:5}]
        },
        options:{responsive:true,maintainAspectRatio:false,
          scales:{y:{beginAtZero:true,max:100,grid:{color:'rgba(255,255,255,.06)'},ticks:{color:'rgba(154,171,216,.8)'}},x:{grid:{display:false},ticks:{color:'rgba(154,171,216,.8)'}}},
          plugins:{legend:{display:false}}}
      });
    } catch(e){ console.error(e); }
  });
</script>
</body>
</html>
