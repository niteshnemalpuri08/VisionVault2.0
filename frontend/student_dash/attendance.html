<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>My Attendance — GIET Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;margin-bottom:24px;}
    .sub-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 14px;text-align:center;transition:transform .25s;}
    .sub-card:hover{transform:translateY(-4px);}
    .sub-name{font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
    .sub-val{font-family:'Outfit',sans-serif;font-size:2em;font-weight:800;display:block;margin-bottom:6px;}
    .sub-cnt{font-size:.75em;background:rgba(0,0,0,.25);padding:3px 10px;border-radius:99px;color:var(--gold);font-weight:600;}
  </style>
</head>
<body>
<div class="page page-narrow">
  <div class="topbar">
    <div>
      <div class="topbar-title">📅 My Attendance</div>
      <div class="topbar-sub">Subject-wise breakdown · 50 total classes</div>
    </div>
    <a href="index.html" class="back-btn">← Dashboard</a>
  </div>

  <div class="sub-grid" id="subGrid">
    <div class="card"><p style="color:var(--muted);text-align:center">Loading…</p></div>
  </div>

  <div class="card">
    <div class="card-hd"><span class="card-title">Visual Distribution</span></div>
    <div class="chart-box"><canvas id="attChart"></canvas></div>
  </div>
</div>
<script>
  const user = JSON.parse(localStorage.getItem('user'));
  if (!user) window.location.replace('../login.html');
  const TOTAL = 50;

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const data = await fetch(`/api/students/${user.username}`).then(r=>r.json());
      const ov = data.attendance || 0;
      const subjects = [
        {name:'Mathematics',  val:ov},
        {name:'Physics',      val:Math.max(ov-5,0)},
        {name:'Chemistry',    val:Math.min(ov+2,100)},
        {name:'Computer Sci', val:Math.min(ov+5,100)},
        {name:'English',      val:Math.max(ov-3,0)},
        {name:'Phys. Ed',     val:95}
      ];

      document.getElementById('subGrid').innerHTML = subjects.map(s => {
        const ok = s.val >= 75;
        const col = ok ? 'var(--cyan)' : 'var(--red)';
        const cnt = Math.round(s.val/100*TOTAL);
        return `<div class="sub-card" style="border-bottom:3px solid ${col}">
          <div class="sub-name">${s.name}</div>
          <span class="sub-val" style="color:${col}">${s.val}%</span>
          <div class="sub-cnt">${cnt} / ${TOTAL}</div>
          <div class="att-track" style="margin-top:8px">
            <div class="att-fill ${ok?'':'warn'}" style="width:${s.val}%"></div>
          </div>
        </div>`;
      }).join('');

      new Chart(document.getElementById('attChart'),{
        type:'bar',
        data:{
          labels:subjects.map(s=>s.name),
          datasets:[{
            label:'Attendance %', data:subjects.map(s=>s.val),
            backgroundColor:subjects.map(s=>s.val<75?'rgba(239,68,68,.65)':'rgba(34,211,238,.65)'),
            borderRadius:8,borderSkipped:false
          }]
        },
        options:{
          responsive:true,maintainAspectRatio:false,
          scales:{
            y:{beginAtZero:true,max:100,grid:{color:'rgba(255,255,255,.06)'},ticks:{color:'rgba(154,171,216,.8)'}},
            x:{grid:{display:false},ticks:{color:'rgba(154,171,216,.8)'}}
          },
          plugins:{legend:{display:false}}
        }
      });
    } catch(e){ console.error(e); }
  });
</script>
</body>
</html>
