<!-- behavior.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Behaviour — GIET Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    .score-ring-wrap{display:flex;flex-direction:column;align-items:center;padding:40px 20px;text-align:center;}
    .score-ring{width:180px;height:180px;border-radius:50%;border:10px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;transition:.5s;}
    .ring-val{font-family:'Outfit',sans-serif;font-size:3.5em;font-weight:900;line-height:1;}
    .ring-lbl{font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px;}
    .ai-tag{display:inline-block;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:99px;padding:8px 18px;font-size:.88em;}
    .log-item{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.04);padding:14px 16px;border-radius:var(--r-sm);margin-bottom:10px;transition:.2s;}
    .log-item:hover{background:rgba(255,255,255,.08);transform:translateX(4px);}
  </style>
</head>
<body>
<div class="page page-narrow">
  <div class="topbar">
    <div>
      <div class="topbar-title">⭐ Behavioural Analytics</div>
      <div class="topbar-sub">Discipline & conduct via AI insights</div>
    </div>
    <a href="index.html" class="back-btn">← Dashboard</a>
  </div>
  <div class="card" style="margin-bottom:20px">
    <div class="score-ring-wrap">
      <div class="score-ring" id="ring">
        <span class="ring-val" id="score">--</span>
        <span class="ring-lbl">Points</span>
      </div>
      <div class="ai-tag" id="aiLbl">🤖 AI Evaluation: Loading…</div>
    </div>
  </div>
  <div class="card">
    <div class="card-hd"><span class="card-title">📝 Conduct Log</span></div>
    <div id="logList"></div>
  </div>
</div>
<script src="../data_store.js"></script><script src="student_sync.js"></script>
<script>
  const user = JSON.parse(localStorage.getItem('user'));
  if (!user) window.location.replace('../login.html');

  document.addEventListener('DOMContentLoaded', () => {
    let att = 85;
    try { if (typeof STUDENT_SYNC !== 'undefined') { const d = STUDENT_SYNC.getData(); if(d) att = d.stats.attendance; } } catch(e){}
    let sc = 80;
    if (att > 90) sc += 15; else if (att > 80) sc += 10; else if (att < 75) sc -= 10;
    sc = Math.min(100, Math.max(0, sc));

    const ring = document.getElementById('ring'), lbl = document.getElementById('aiLbl');
    document.getElementById('score').textContent = sc;
    if (sc >= 90) { ring.style.borderColor='#10b981'; ring.style.boxShadow='0 0 40px rgba(16,185,129,.3)'; lbl.textContent='🤖 AI: Exemplary Conduct'; }
    else if (sc >= 75) { ring.style.borderColor='#f59e0b'; ring.style.boxShadow='0 0 40px rgba(245,158,11,.25)'; lbl.textContent='🤖 AI: Good Standing'; }
    else { ring.style.borderColor='#ef4444'; ring.style.boxShadow='0 0 40px rgba(239,68,68,.3)'; lbl.textContent='🤖 AI: Attention Required'; }

    const logs = sc >= 90
      ? [['Perfect Attendance Month','+10 pts','badge-green'],['Active Class Participation','+5 pts','badge-green']]
      : sc >= 75
      ? [['Consistent Submissions','+5 pts','badge-green'],['Minor Punctuality Issue','-2 pts','badge-red']]
      : [['Unexcused Absence (CS)','-5 pts','badge-red'],['Classroom Disturbance','-10 pts','badge-red']];

    document.getElementById('logList').innerHTML = logs.map(([t,p,c])=>`
      <div class="log-item"><span style="font-weight:500;font-size:.875em">${t}</span><span class="badge ${c}">${p}</span></div>`).join('');
  });
</script>
</body>
</html>
