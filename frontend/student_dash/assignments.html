<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Assignments — GIET Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    .task{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-md);padding:22px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;transition:all .3s;margin-bottom:14px;border-left:4px solid var(--c,var(--border));}
    .task:hover{background:var(--glass-hover);transform:translateX(4px);}
    .task.risk{--c:#ef4444;animation:pulse 2s infinite;}
    .task.pend{--c:#f59e0b;}
    .task.done{--c:#10b981;opacity:.82;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
    .task-title{font-weight:700;font-size:1em;margin-bottom:4px;}
    .task-sub{font-size:.8em;color:var(--muted);}
    .ai-tag{display:inline-block;background:rgba(91,124,255,.2);color:#a5b4fc;border:1px solid rgba(91,124,255,.3);border-radius:6px;font-size:.72em;padding:3px 9px;margin-top:8px;font-weight:600;}
    .score-tag{display:inline-block;background:rgba(16,185,129,.2);color:#6ee7b7;border:1px solid rgba(16,185,129,.3);border-radius:6px;font-size:.72em;padding:3px 9px;margin-top:8px;font-weight:700;}
    .done-check{color:var(--green);font-size:1.4em;}
    .upload-btn{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:.83em;cursor:pointer;flex-shrink:0;transition:.2s;}
    .upload-btn:hover{transform:scale(1.05);}
  </style>
</head>
<body>
<div class="page page-narrow">
  <div class="topbar">
    <div>
      <div class="topbar-title">📝 My Assignments</div>
      <div class="topbar-sub">Track and submit your semester tasks</div>
    </div>
    <a href="index.html" class="back-btn">← Dashboard</a>
  </div>
  <div id="taskList"></div>
</div>
<script src="../data_store.js"></script>
<script src="student_sync.js"></script>
<script>
  const user = JSON.parse(localStorage.getItem('user'));
  if (!user || user.role !== 'student') window.location.replace('../login.html');

  document.addEventListener('DOMContentLoaded', () => {
    let pending = 2;
    try {
      if (typeof STUDENT_SYNC !== 'undefined') {
        const d = STUDENT_SYNC.getData();
        if (d) pending = d.stats.assignmentsPending;
      }
    } catch(e){}

    const tasks = [];
    if (pending > 0) tasks.push({cls:'risk',title:'Math: Integration Problems',sub:'Mathematics · ⚠️ Due Tomorrow',ai:'🤖 AI Forecast: 88% Expected Grade',done:false});
    if (pending > 1) tasks.push({cls:'pend',title:'Physics: Lab Report',sub:'Physics · Due This Friday',ai:'🤖 AI Forecast: 92% Expected Grade',done:false});
    tasks.push({cls:'done',title:'English: Essay on Macbeth',sub:'Submitted · Feedback: Excellent structure',score:'Score: 85/100',done:true});
    tasks.push({cls:'done',title:'CS: Java Project',sub:'Submitted · Feedback: Optimized logic',score:'Score: 98/100',done:true});

    document.getElementById('taskList').innerHTML = tasks.map(t => `
      <div class="task ${t.cls}">
        <div>
          <div class="task-title">${t.title}</div>
          <div class="task-sub">${t.sub}</div>
          ${t.ai    ? `<div class="ai-tag">${t.ai}</div>` : ''}
          ${t.score ? `<div class="score-tag">${t.score}</div>` : ''}
        </div>
        ${t.done ? '<span class="done-check">✅</span>' : '<button class="upload-btn">Upload</button>'}
      </div>`).join('');
  });
</script>
</body>
</html>
