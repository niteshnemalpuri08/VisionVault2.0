<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Pay Fees — GIET Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
    .qr-box{background:rgba(255,255,255,.95);padding:16px;border-radius:16px;display:inline-block;margin-bottom:14px;}
    .qr-box img{width:180px;height:180px;object-fit:contain;display:block;}
    .upi-code{font-family:monospace;background:rgba(255,255,255,.08);padding:4px 12px;border-radius:8px;color:var(--cyan);font-size:.88em;}
    .step-lbl{font-size:.72em;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;font-weight:700;}
    @media(max-width:640px){.two-col{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="page page-narrow">
  <div class="topbar">
    <div>
      <div class="topbar-title">💳 Fee Payment</div>
      <div class="topbar-sub">Secure payment with receipt</div>
    </div>
    <a href="index.html" class="back-btn">← Dashboard</a>
  </div>

  <div class="two-col">
    <div class="card" style="text-align:center">
      <div class="step-lbl">Step 1: Scan & Pay</div>
      <div class="qr-box">
        <img src="../upi_qr.jpg.jpeg" alt="QR Code" onerror="this.src='https://via.placeholder.com/180?text=QR'">
      </div>
      <div>UPI: <span class="upi-code">niteshnemalpuri17@okicici</span></div>
    </div>
    <div class="card">
      <div class="step-lbl">Step 2: Submit Proof</div>
      <div class="form-grp">
        <label class="form-lbl">Amount Paid (₹)</label>
        <input type="number" class="form-ctrl" id="amt" placeholder="e.g. 50000">
      </div>
      <div class="form-grp">
        <label class="form-lbl">UPI Transaction ID</label>
        <input type="text" class="form-ctrl" id="txn" placeholder="12-digit ID">
      </div>
      <div class="form-grp">
        <label class="form-lbl">Upload Screenshot</label>
        <input type="file" class="form-ctrl" id="file" accept="image/*">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;margin-top:4px" id="verBtn" onclick="submit()">
        Verify & Get Receipt
      </button>
      <p id="statusTxt" style="text-align:center;margin-top:12px;font-size:.85em;min-height:18px"></p>
    </div>
  </div>
</div>
<script>
  const user = JSON.parse(localStorage.getItem('user'));
  if (!user) window.location.replace('../login.html');

  async function submit() {
    const btn=document.getElementById('verBtn'), txt=document.getElementById('statusTxt');
    const amt=document.getElementById('amt').value, txn=document.getElementById('txn').value, file=document.getElementById('file').files[0];
    if (!amt||!txn||!file){ txt.textContent='⚠️ Please fill all fields and upload screenshot.';txt.style.color='#fca5a5';return;}
    const fd=new FormData();
    fd.append('username',user.username);fd.append('amount',amt);fd.append('txn_id',txn);fd.append('screenshot',file);
    btn.disabled=true;btn.textContent='⌛ Processing…';txt.textContent='Uploading…';txt.style.color='';
    try{
      const data=await fetch('/api/payment/upload_proof',{method:'POST',body:fd}).then(r=>r.json());
      if(data.success){btn.textContent='✅ Done';btn.style.background='linear-gradient(135deg,#059669,#10b981)';txt.textContent='Receipt sent to parent email!';txt.style.color='#6ee7b7';setTimeout(()=>window.location.href='index.html',3000);}
      else throw new Error(data.message||'Failed');
    }catch(e){btn.disabled=false;btn.textContent='Verify & Get Receipt';btn.style.background='';txt.textContent='❌ '+e.message;txt.style.color='#fca5a5';}
  }
</script>
</body>
</html>
