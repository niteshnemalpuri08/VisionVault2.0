<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Bunk Calculator — GIET Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
    .calc-btn{width:100%;padding:12px;border-radius:10px;border:none;color:#fff;font-weight:700;cursor:pointer;margin-bottom:10px;transition:.25s;font-family:'Plus Jakarta Sans',sans-serif;font-size:.9em;}
    .calc-btn:hover{transform:translateY(-2px);}
    .result{background:rgba(0,0,0,.25);padding:18px;border-radius:12px;margin-top:14px;text-align:center;border-left:4px solid var(--c,var(--border));animation:slideIn .35s ease;}
    .result-num{font-family:'Outfit',sans-serif;font-size:2.2em;font-weight:900;display:block;margin:5px 0;}
    .result-sub{font-size:.78em;color:var(--muted);}
    @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media(max-width:640px){.two-col{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div>
      <div class="topbar-title">🧮 Attendance Calculator</div>
      <div class="topbar-sub">Smart attendance planning tool</div>
    </div>
    <a href="index.html" class="back-btn">← Dashboard</a>
  </div>

  <div class="two-col">
    <div class="card">
      <div class="card-hd"><span class="card-title">📈 Status Analyzer</span></div>
      <div class="form-grp"><label class="form-lbl">Total Classes Conducted</label><input type="number" class="form-ctrl" id="tot" placeholder="e.g. 50"></div>
      <div class="form-grp"><label class="form-lbl">Classes You Attended</label><input type="number" class="form-ctrl" id="att" placeholder="e.g. 40"></div>
      <div class="form-grp">
        <label class="form-lbl">Target Percentage</label>
        <select class="form-ctrl" id="tgt">
          <option value="75">75% (Minimum)</option>
          <option value="80" selected>80% (Safe)</option>
          <option value="85">85% (Scholar)</option>
          <option value="90">90% (Distinction)</option>
        </select>
      </div>
      <button class="calc-btn" style="background:linear-gradient(135deg,#10b981,#059669)" onclick="calcNeeded()">Classes Needed →</button>
      <button class="calc-btn" style="background:linear-gradient(135deg,#f59e0b,#d97706)" onclick="calcBunkable()">Can I Bunk?</button>
      <div id="calcRes"></div>
    </div>

    <div class="card">
      <div class="card-hd"><span class="card-title">🔮 Trend Predictor</span></div>
      <div class="form-grp"><label class="form-lbl">Upcoming Classes (next 10–20 days)</label><input type="number" class="form-ctrl" id="fut" value="15"></div>
      <div class="form-grp">
        <label class="form-lbl">How Regular Will You Be?</label>
        <select class="form-ctrl" id="futRate">
          <option value="100">100% — Every class</option>
          <option value="80" selected>80% — Regular</option>
          <option value="50">50% — Many misses</option>
          <option value="0">0% — On leave</option>
        </select>
      </div>
      <button class="calc-btn" style="background:linear-gradient(135deg,#7c3aed,#5b7cff);margin-top:8px" onclick="predictFinal()">Predict Final %</button>
      <div id="predRes"></div>
    </div>
  </div>
</div>
<script>
  const user=JSON.parse(localStorage.getItem('user'));
  if(!user)window.location.replace('../login.html');

  function getIn(){return{a:parseInt(document.getElementById('att').value),t:parseInt(document.getElementById('tot').value),tgt:parseInt(document.getElementById('tgt').value)/100};}

  function calcNeeded(){
    const{a,t,tgt}=getIn(), el=document.getElementById('calcRes');
    if(isNaN(a)||isNaN(t)){el.innerHTML=res('⚠️ Enter valid values','rgba(245,158,11,.1)','#f59e0b');return;}
    const curr=(a/t)*100;
    if(curr>=tgt*100){el.innerHTML=res(`✅ Already at ${curr.toFixed(1)}% — Target met!`,'rgba(16,185,129,.1)','#10b981');}
    else{const need=Math.ceil((tgt*t-a)/(1-tgt));el.innerHTML=res(`Attend next <span class="result-num">${need}</span> classes without leave.`,'rgba(34,211,238,.1)','var(--cyan)');}
  }

  function calcBunkable(){
    const{a,t,tgt}=getIn(), el=document.getElementById('calcRes');
    if(isNaN(a)||isNaN(t))return;
    const curr=(a/t)*100;
    if(curr<tgt*100){el.innerHTML=res('❌ Cannot bunk — already below target.','rgba(239,68,68,.1)','#ef4444');return;}
    const bunk=Math.floor((a/tgt)-t);
    if(bunk<=0)el.innerHTML=res('⚠️ On the edge — don\'t miss any more.','rgba(245,158,11,.1)','#f59e0b');
    else el.innerHTML=res(`You can safely miss <span class="result-num">${bunk}</span> classes.`,'rgba(16,185,129,.1)','#10b981');
  }

  function predictFinal(){
    const{a,t}=getIn(), fut=parseInt(document.getElementById('fut').value), rate=parseInt(document.getElementById('futRate').value)/100, el=document.getElementById('predRes');
    if(isNaN(a)||isNaN(t)||isNaN(fut))return;
    const final=((a+Math.round(fut*rate))/(t+fut)*100).toFixed(1);
    el.innerHTML=res(`Forecasted Final: <span class="result-num">${final}%</span>`,'rgba(124,58,237,.1)','#a78bfa');
  }

  function res(html,bg,border){return`<div class="result" style="background:${bg};--c:${border}"><div style="font-size:.875em;line-height:1.6">${html}</div></div>`;}
</script>
</body>
</html>
