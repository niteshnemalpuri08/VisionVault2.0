<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Mark Attendance — GIET Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    .tbl-wrap{overflow-x:auto;}
    .att-check{width:20px;height:20px;accent-color:var(--cyan);cursor:pointer;}
    .submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:12px;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:1em;font-weight:800;cursor:pointer;margin-top:16px;transition:.25s;}
    .submit-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 24px rgba(16,185,129,.4);}
    .submit-btn:disabled{opacity:.6;cursor:not-allowed;}
    .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);}
  </style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div>
      <div class="topbar-title">📝 Mark Attendance</div>
      <div class="topbar-sub">Section: <span id="sec" style="color:var(--cyan)">—</span> · <span id="dt" style="color:var(--muted)"></span></div>
    </div>
    <a href="index.html" class="back-btn">← Dashboard</a>
  </div>

  <div class="card" style="padding:0;overflow:hidden">
    <div class="toolbar">
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost btn-sm" onclick="markAll(true)">✅ All Present</button>
        <button class="btn btn-danger btn-sm" onclick="markAll(false)">❌ All Absent</button>
      </div>
      <span class="badge badge-blue" id="presCnt">Present: 0</span>
    </div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Roll No</th><th>Name</th><th>Current Att.</th><th>Present Today</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="4" style="text-align:center;padding:30px;color:var(--muted)">Loading…</td></tr></tbody>
      </table>
    </div>
    <div style="padding:16px 18px;border-top:1px solid var(--border)">
      <button class="submit-btn" id="subBtn" onclick="submitAtt()">🚀 Submit & Notify Parents</button>
    </div>
  </div>
</div>
<script>
  const user=JSON.parse(localStorage.getItem('user'));
  if(!user||user.role!=='teacher')window.location.replace('../login.html');
  document.getElementById('dt').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

  document.addEventListener('DOMContentLoaded',async()=>{
    try{
      const data=await fetch('/api/teacher/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.username})}).then(r=>r.json());
      document.getElementById('sec').textContent=data.section;
      const tb=document.getElementById('tbody'); tb.innerHTML='';
      data.students.forEach(s=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td><strong style="color:var(--cyan)">${s.roll.toUpperCase()}</strong></td><td>${s.name}</td><td><span class="badge ${s.attendance<75?'badge-red':'badge-green'}">${s.attendance}%</span></td><td><input type="checkbox" class="att-check" data-roll="${s.roll}" checked></td>`;
        tb.appendChild(tr);
      });
      upd();
      document.querySelectorAll('.att-check').forEach(c=>c.addEventListener('change',upd));
    }catch(e){document.getElementById('tbody').innerHTML='<tr><td colspan="4" style="text-align:center;color:#ef4444">Connection error</td></tr>';}
  });

  function upd(){const t=document.querySelectorAll('.att-check').length,p=document.querySelectorAll('.att-check:checked').length;document.getElementById('presCnt').textContent=`Present: ${p} / ${t}`;}
  function markAll(v){document.querySelectorAll('.att-check').forEach(c=>c.checked=v);upd();}

  async function submitAtt(){
    if(!confirm("Submit attendance? Absent students' parents will be notified."))return;
    const btn=document.getElementById('subBtn'); btn.textContent='⌛ Processing…'; btn.disabled=true;
    const payload=[]; document.querySelectorAll('.att-check').forEach(c=>payload.push({roll:c.dataset.roll,present:c.checked}));
    try{
      const res=await fetch('/api/attendance/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attendance:payload})}).then(r=>r.json());
      if(res.success){alert(res.message||'✅ Attendance submitted!');window.location.href='index.html';}
      else throw new Error(res.error||'Failed');
    }catch(e){alert('Error: '+e.message);}
    finally{btn.disabled=false;btn.textContent='🚀 Submit & Notify Parents';}
  }
</script>
</body>
</html>
