<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Parent Communication — GIET Portal</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    /* Chat Layout Specifics */
    .chat-layout { display: grid; grid-template-columns: 300px 1fr; gap: 24px; height: 68vh; min-height: 550px; }
    
    /* Student List Styling */
    .student-list { overflow-y: auto; padding-right: 8px; display: flex; flex-direction: column; gap: 10px; height: calc(100% - 30px); }
    .student-item {
      padding: 16px; background: var(--glass); border: 1px solid var(--border);
      border-radius: var(--r-md); cursor: pointer; transition: all .25s var(--ease);
      border-left: 3px solid transparent;
    }
    .student-item:hover { 
      background: var(--glass-hover); 
      border-color: rgba(91,124,255,0.3); 
      transform: translateX(4px); 
    }
    .student-item.active { 
      background: rgba(91,124,255,0.1); 
      border-left-color: var(--accent); 
      border-color: var(--border-accent); 
    }
    .student-name { font-weight: 700; color: var(--txt); display: block; margin-bottom: 4px; font-size: 0.95em; }
    .student-roll { font-size: 0.72em; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    /* Chat Area Layout */
    .chat-container { display: flex; flex-direction: column; height: 100%; }
    .chat-box-wrap { 
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; 
      padding: 16px; background: rgba(0,0,0,0.15); border-radius: var(--r-md); 
      border: inset 1px rgba(255,255,255,0.02); margin-bottom: 16px; 
    }
    
    /* Input Area */
    .input-area { display: flex; gap: 12px; align-items: center; }
    .input-area .form-ctrl { flex: 1; border-radius: 99px; padding: 14px 22px; }
    .input-area .btn { border-radius: 99px; padding: 12px 28px; }

    @media(max-width: 768px) {
      .chat-layout { grid-template-columns: 1fr; height: auto; display: flex; flex-direction: column; }
      .student-list { height: 250px; }
      .chat-container { height: 600px; }
    }
  </style>
</head>
<body>
<div class="page page-wide">
  
  <div class="topbar">
    <div>
      <div class="topbar-title">💬 Parent Communication</div>
      <div class="topbar-sub">Direct messaging channel</div>
    </div>
    <a href="index.html" class="back-btn">← Dashboard</a>
  </div>

  <div class="chat-layout">
    
    <div class="card">
      <div class="card-hd"><span class="card-title">📋 Contacts</span></div>
      <div class="student-list" id="studentList">
        <div class="empty"><p>Loading contacts...</p></div>
      </div>
    </div>

    <div class="card chat-container">
      <div class="card-hd">
        <span class="card-title" id="chatHeader" style="color: var(--gold); font-size: 0.9em;">Select a student's parent</span>
      </div>
      
      <div class="chat-box-wrap chat-box" id="chatBox">
        <div class="empty"><div class="ico">✉️</div><p>Select a contact to start messaging</p></div>
      </div>
      
      <div class="input-area">
        <input type="text" class="form-ctrl" id="msgInput" placeholder="Type your message..." disabled onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()" disabled>Send →</button>
      </div>
    </div>

  </div>
</div>

<script>
  const user = JSON.parse(localStorage.getItem('user'));
  let currentParent = null;
  let refreshInterval = null;

  document.addEventListener('DOMContentLoaded', () => {
    if(!user || user.role !== 'teacher') window.location.href = '../login.html';
    loadStudents();
  });

  async function loadStudents() {
    try {
      const res = await fetch('/api/teacher/students', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: user.username })
      });
      const data = await res.json();
      const list = document.getElementById('studentList');
      list.innerHTML = '';
      
      data.students.forEach(s => {
        const parentUid = 'p_' + s.roll.toLowerCase(); 
        const div = document.createElement('div');
        div.className = 'student-item';
        div.innerHTML = `<span class="student-name">${s.name}</span><span class="student-roll">Roll: ${s.roll}</span>`;
        div.onclick = () => selectParent(parentUid, s.name, div);
        list.appendChild(div);
      });
    } catch(e) { 
      console.error("Contact load error:", e);
      document.getElementById('studentList').innerHTML = '<div class="alert alert-danger">Failed to load contacts.</div>';
    }
  }

  function selectParent(parentUid, studentName, el) {
    currentParent = parentUid;
    document.querySelectorAll('.student-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    document.getElementById('chatHeader').innerText = "Messaging: Parent of " + studentName;
    document.getElementById('msgInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('chatBox').innerHTML = '<div class="empty"><p class="skeleton" style="width:150px;height:20px;"></p></div>';
    
    if(refreshInterval) clearInterval(refreshInterval);
    loadMsgs();
    refreshInterval = setInterval(loadMsgs, 3000);
  }

  async function loadMsgs() {
    if(!currentParent) return;
    try {
      const res = await fetch('/api/chat/history', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user1: user.username, user2: currentParent })
      });
      const msgs = await res.json();
      const box = document.getElementById('chatBox');
      
      // Updated JS to use theme.css classes: 'chat-bubble', 'sent', and 'recv'
      const html = msgs.length > 0 
        ? msgs.map(m => `<div class="chat-bubble ${m.sender === user.username ? 'sent' : 'recv'}">${m.content}</div>`).join('')
        : '<div class="empty"><p>No messages yet. Start the conversation!</p></div>';
        
      if(box.innerHTML !== html) {
        box.innerHTML = html;
        box.scrollTop = box.scrollHeight;
      }
    } catch(e) {}
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if(!content || !currentParent) return;
    try {
      const res = await fetch('/api/chat/send', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ sender: user.username, receiver: currentParent, content: content })
      });
      if(res.ok) {
        input.value = '';
        loadMsgs();
      }
    } catch(e) { 
      alert("Failed to send message."); 
    }
  }
</script>
</body>
</html>
