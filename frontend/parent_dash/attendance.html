<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Record — GIET Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../theme.css">
  <style>
    /* Hero stat display */
    .att-hero {
      background: linear-gradient(135deg, rgba(34,211,238,0.1), rgba(91,124,255,0.05));
      border: 1px solid var(--border-accent);
      border-radius: var(--r-xl);
      padding: 56px 32px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .att-num {
      font-family: 'Outfit', sans-serif;
      font-size: 6em;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .att-lbl {
      font-size: 0.85em;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }
  </style>
</head>
<body>
<div class="page page-narrow">
  
  <div class="topbar">
    <div>
      <div class="topbar-title">📅 Attendance Record</div>
      <div class="topbar-sub">Real-time attendance tracking</div>
    </div>
    <a href="index.html" class="back-btn">← Dashboard</a>
  </div>

  <div class="att-hero">
    <div class="att-num" id="attPct">--%</div>
    <div class="att-lbl">Overall Attendance</div>
  </div>

  <div id="statusBox">
    <div class="skeleton" style="width: 100%; height: 60px; border-radius: var(--r-md);"></div>
  </div>

</div>

<script>
  // 1. AUTH GUARD
  const user = JSON.parse(localStorage.getItem('user'));
  if (!user || user.role !== 'parent') window.location.href = '../login.html';

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      // 2. Fetch specific child data
      const res = await fetch('/api/parent/child', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user.username })
      });
      const data = await res.json();
      
      if (data.error) throw new Error(data.error);

      const pct = data.attendance || 0;
      
      document.getElementById('attPct').textContent = pct + '%';

      // 3. Status Box injection using theme.css alert classes
      const box = document.getElementById('statusBox');
      if (pct >= 75) {
        box.innerHTML = `
          <div class="alert alert-success">
            <div style="font-size: 1.5em;">✅</div>
            <div><strong>Good Standing:</strong> Your child is attending classes regularly.</div>
          </div>`;
      } else {
        box.innerHTML = `
          <div class="alert alert-danger">
            <div style="font-size: 1.5em;">⚠️</div>
            <div><strong>Warning:</strong> Attendance is critically low. Please contact the teacher immediately.</div>
          </div>`;
      }
    } catch (e) { 
      console.error(e); 
      document.getElementById('statusBox').innerHTML = `
        <div class="alert alert-warning">
          ⚠️ Failed to load attendance data. Please try refreshing.
        </div>`;
    }
  });
</script>
</body>
</html>
